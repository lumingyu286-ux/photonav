<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>取景框 - 相机、技法、图库与后期网址分类</title>
<meta name="description" content="按分类整理的摄影网址：相机器材、学习技法、图库授权、后期调色、灵感与大师、社区评图，每类配有插画，支持站内查找和本地收藏。含成人内容分区，仅限 18 周岁及以上访问。">

<!-- ↓ 镜像站取消这一行注释，主力站保持注释。详见 README.md
     只开 noindex,follow。别再加 canonical：两个信号矛盾，
     canonical 会把 noindex 一并传过去。 -->
<!-- <meta name="robots" content="noindex,follow"> -->

<meta property="og:type" content="website">
<meta property="og:locale" content="zh_CN">
<meta property="og:title" content="取景框 - 相机、技法、图库与后期网址分类">
<meta property="og:description" content="相机、技法、图库、后期与社区的分类网址，每类配有插画。">
<!-- og:image 必须是绝对网址，而且社交平台不渲染 SVG，所以用 PNG。
     指向主力站那一份：页面在哪个域名下都能被抓到这张图。 -->
<meta property="og:image" content="https://photonav.pages.dev/art/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<!-- no-referrer 而不是 no-referrer-when-downgrade：
     后者会把完整来源网址发给目标站，成人条目那一条尤其不该这样。 -->
<meta name="referrer" content="no-referrer">
<!-- 内联 data: 图标：没有它每次首访都会请求 /favicon.ico，
     而两个托管平台都用 404.html 来响应，浏览器拿到一份 HTML
     当图片解码，控制台报错。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312151A'/%3E%3Ccircle cx='16' cy='17' r='8' fill='none' stroke='%23F2653F' stroke-width='3'/%3E%3Crect x='11' y='6' width='10' height='4' rx='1.5' fill='%239AA5B2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script>
  /* 兜底卡默认不显示。脚本放在 body 末尾，慢速连接下浏览器会先
     把它画出来——正常加载却看到「没能加载完整」是误判。
     等 4 秒，到时候 app.js 还没启动才揭开。 */
  setTimeout(function () {
    var h = document.documentElement;
    if (h.className.indexOf('js-ok') === -1) h.className += ' boot-show';
  }, 4000);
</script>
</head>
<body>

<!-- 脚本没起来时的兜底。app.js 一启动就会把它藏掉。 -->
<div class="boot">
  <h2>页面没能加载完整</h2>
  <p>刷新一下通常就好。如果反复这样，可能是拦截插件挡掉了本页的脚本。</p>
</div>

<noscript>
  <!-- 禁用 JS 时上面那个 setTimeout 也不会跑，所以 .boot 一直是
       隐藏的；这一张用 .ns 单独揭开，不会和它叠成两张卡片。 -->
  <div class="boot ns">
    <h2>需要开启 JavaScript</h2>
    <p>本页的分类与查找功能依赖脚本。</p>
  </div>
  <style>.boot.ns { display: block; }</style>
</noscript>

<div id="shell" class="shell" hidden>

  <header class="hero">
    <div class="hero-in">
      <!-- 头图是装饰性的，正文信息不依赖它，所以 alt 留空、
           用 aria-hidden 让读屏器跳过，别念一遍"相机插画"。 -->
      <img class="hero-art" src="art/hero.svg" alt="" aria-hidden="true" width="960" height="300">
      <h1 class="title" id="brand-name">取景框</h1>
      <p class="lede" id="brand-tag"></p>

      <form id="find-form" class="find" role="search">
        <label class="sr-only" for="engine">查找方式</label>
        <select id="engine">
          <option value="local">站内查找</option>
          <option value="baidu">百度</option>
          <option value="bing">Bing</option>
          <option value="google">Google</option>
        </select>
        <label class="sr-only" for="find">关键词</label>
        <input id="find" type="search" placeholder="搜站点名、用途，或按 / 聚焦" autocomplete="off" spellcheck="false">
        <button type="submit">查找</button>
      </form>

      <div class="tools">
        <!-- 收藏之前只改了个图标、存了个数组，没有任何地方用到。
             这个开关让星标真的起作用。 -->
        <button type="button" id="only-fav" class="theme" aria-pressed="false">只看收藏</button>
        <!-- aria-label 必须包含可见文字「切换主题」，
             否则语音控制念可见文字匹配不上（WCAG 2.5.3）。 -->
        <button type="button" id="theme" class="theme" aria-label="切换主题">切换主题</button>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- 每个分类是一张带插画的卡片 -->
    <div id="groups" class="deck"></div>
    <p id="empty" class="empty" role="status" hidden></p>
  </main>

  <footer class="foot">
    <p class="foot-age"><span class="mark">18+</span> 成人内容分区仅限年满 18 周岁者访问</p>
    <p class="foot-note" id="foot-note"></p>
    <p class="foot-art">插画为本站自绘的 SVG，随页面一起发布，不依赖外部图床。</p>
  </footer>
</div>

<!-- 成人条目的点击确认。只拦那一条，其余链接照常直达。 -->
<div id="ask" class="ask" role="dialog" aria-modal="true" aria-labelledby="ask-title" hidden>
  <div class="ask-panel">
    <p class="mark-row"><span class="mark">18+</span></p>
    <h2 id="ask-title">这是成人内容</h2>
    <p class="ask-body">你正要打开 <span id="ask-name"></span>，内容面向成年人。请确认你已满 18 周岁。</p>
    <div class="ask-actions">
      <button type="button" id="ask-ok" class="btn">我已满 18 周岁，继续</button>
      <button type="button" id="ask-no" class="btn btn-quiet">取消</button>
    </div>
    <p class="ask-fine">确认结果只存在这台设备的浏览器里，下次不再询问。</p>
  </div>
</div>

<script src="sites.js"></script>
<script src="app.js"></script>
</body>
</html>
